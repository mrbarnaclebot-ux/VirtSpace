<!doctype html>
<!--
  VirtSpace Stage C — Spark 3D world explorer (WKWebView).

  Adapted from tools/spike/viewer.html. Differences from the spike:
    * The CDN importmap is replaced by imports resolved through the custom
      `virtspace-viewer://` WKURLSchemeHandler (no runtime CDN — spec §3.1).
    * Drag-to-look is a first-person yaw/pitch controller (not OrbitControls) so
      we don't have to bundle three/addons/controls — cleaner and truer to
      "drag to look around".
    * The splat loads from `virtspace-viewer://assets/world.spz`.
    * A postMessage bridge (webkit.messageHandlers.viewer) reports lifecycle to
      native: {loaded}, {progress:0..1}, {error:message}, {interaction},
      {stick: x,y,width,height} (the joystick frame, for native coach marks).
    * The 180° X-axis flip (World Labs splats are Y-down vs three.js) is kept but
      gated behind a `?flip=1` (default on) query param so on-device verification
      can flip it off without a rebuild.
-->
<html>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<title>VirtSpace — 3D World</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;
    font-family:-apple-system,system-ui,sans-serif;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  #stage{position:fixed;inset:0;touch-action:none}
  #err{position:fixed;top:42%;left:0;right:0;text-align:center;color:#f66;
    font-size:14px;z-index:20;white-space:pre-wrap;padding:0 24px;display:none}
  /* Joystick — bottom-center, thumb-reachable. */
  #stick{position:fixed;bottom:calc(28px + env(safe-area-inset-bottom));left:50%;
    transform:translateX(-50%);width:120px;height:120px;border-radius:60px;
    background:rgba(255,255,255,.10);border:2px solid rgba(255,255,255,.35);
    z-index:10;touch-action:none;backdrop-filter:blur(6px)}
  #nub{position:absolute;top:35px;left:35px;width:50px;height:50px;border-radius:25px;
    background:rgba(255,255,255,.9);box-shadow:0 2px 10px rgba(0,0,0,.4);
    transition:box-shadow .15s}
  #stick.active #nub{box-shadow:0 0 16px rgba(120,200,255,.9)}
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div id="err"></div>
<div id="stick" role="application" aria-label="Use the stick to walk"><div id="nub"></div></div>
<script type="importmap">
{ "imports": {
  "three": "virtspace-viewer://app/three.module.js",
  "three/addons/postprocessing/Pass.js": "virtspace-viewer://app/Pass.js",
  "@sparkjsdev/spark": "virtspace-viewer://app/spark.module.js"
} }
</script>
<script type="module">
// ── Native bridge ─────────────────────────────────────────────────────────
const bridge = (() => {
  const h = window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.viewer;
  return (msg) => { try { h && h.postMessage(msg); } catch (_) {} };
})();
const errEl = document.getElementById("err");
let didReportError = false;
function fail(message) {
  if (didReportError) return;
  didReportError = true;
  errEl.textContent = "Couldn't render this world.\n" + message;
  errEl.style.display = "block";
  bridge({ type: "error", message: String(message) });
}
window.addEventListener("error", e => fail((e && e.message) || e));
window.addEventListener("unhandledrejection", e => fail((e && e.reason && e.reason.message) || e.reason || "Unhandled error"));

// First interaction → native dismisses the coach marks. Fires once.
let interacted = false;
function markInteraction() {
  if (interacted) return;
  interacted = true;
  bridge({ type: "interaction" });
}

// Joystick frame (CSS px = points) so native can anchor its coach marks
// above the stick. Re-sent on resize and once the world has loaded, by which
// time the safe-area insets are settled.
function reportStick() {
  const r = document.getElementById("stick").getBoundingClientRect();
  bridge({ type: "stick", x: r.left, y: r.top, width: r.width, height: r.height });
}
reportStick();
addEventListener("resize", reportStick);

async function main() {
  const THREE = await import("three");
  const { SparkRenderer, SplatMesh } = await import("@sparkjsdev/spark");

  const canvas = document.getElementById("stage");

  // Fail loudly if the WebView can't give us WebGL2 (Spark requires it). This
  // is the likely simulator failure mode — report it honestly to native.
  if (!canvas.getContext("webgl2")) {
    fail("WebGL2 is not available in this WebView.");
    return;
  }

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(70, innerWidth / innerHeight, 0.01, 1000);
  camera.position.set(0, 0, 0.1);

  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));

  const spark = new SparkRenderer({ renderer });
  scene.add(spark);

  const params = new URLSearchParams(location.search);
  const flip = params.get("flip") !== "0"; // default on

  const splats = new SplatMesh({
    url: "virtspace-viewer://assets/world.spz",
    onProgress: (p) => bridge({ type: "progress", value: Math.max(0, Math.min(1, p || 0)) }),
    onLoad: () => { bridge({ type: "progress", value: 1 }); bridge({ type: "loaded" }); reportStick(); },
  });
  // World Labs splats are Y-down relative to three.js — flip 180° about X so
  // they're upright. Gated behind ?flip so device verification can disable it.
  if (flip) splats.quaternion.setFromEuler(new THREE.Euler(Math.PI, 0, 0));
  scene.add(splats);

  // ── First-person look (drag) ───────────────────────────────────────────
  // yaw around world-up, pitch around local-right; no roll (Euler YXZ).
  let yaw = 0, pitch = 0;
  const LOOK = 0.0045, PITCH_LIMIT = Math.PI / 2 - 0.05;
  let dragId = null, lastX = 0, lastY = 0;
  const stickEl = document.getElementById("stick");
  canvas.addEventListener("pointerdown", e => {
    dragId = e.pointerId; lastX = e.clientX; lastY = e.clientY;
    canvas.setPointerCapture(e.pointerId); markInteraction();
  });
  canvas.addEventListener("pointermove", e => {
    if (e.pointerId !== dragId) return;
    yaw   -= (e.clientX - lastX) * LOOK;
    pitch -= (e.clientY - lastY) * LOOK;
    pitch = Math.max(-PITCH_LIMIT, Math.min(PITCH_LIMIT, pitch));
    lastX = e.clientX; lastY = e.clientY;
  });
  const endDrag = e => { if (e.pointerId === dragId) dragId = null; };
  canvas.addEventListener("pointerup", endDrag);
  canvas.addEventListener("pointercancel", endDrag);

  // ── Joystick move ───────────────────────────────────────────────────────
  const nub = document.getElementById("nub");
  const mv = { x: 0, y: 0 };
  const setNub = (dx, dy) => { nub.style.left = (35 + dx) + "px"; nub.style.top = (35 + dy) + "px"; };
  stickEl.addEventListener("pointerdown", e => {
    stickEl.setPointerCapture(e.pointerId); stickEl.classList.add("active"); markInteraction();
  });
  stickEl.addEventListener("pointermove", e => {
    if (!e.buttons && e.pointerType === "mouse") return;
    const r = stickEl.getBoundingClientRect();
    let dx = e.clientX - (r.left + 60), dy = e.clientY - (r.top + 60);
    const d = Math.hypot(dx, dy), max = 35;
    if (d > max) { dx *= max / d; dy *= max / d; }
    setNub(dx, dy); mv.x = dx / max; mv.y = dy / max;
  });
  const resetStick = () => { setNub(0, 0); mv.x = 0; mv.y = 0; stickEl.classList.remove("active"); };
  stickEl.addEventListener("pointerup", resetStick);
  stickEl.addEventListener("pointercancel", resetStick);

  // ── Render loop ───────────────────────────────────────────────────────────
  const fwd = new THREE.Vector3(), right = new THREE.Vector3(), up = new THREE.Vector3(0, 1, 0);
  const q = new THREE.Quaternion(), e = new THREE.Euler(0, 0, 0, "YXZ");
  renderer.setAnimationLoop(() => {
    e.set(pitch, yaw, 0);
    q.setFromEuler(e);
    camera.quaternion.copy(q);
    // Move in the horizontal plane along camera facing.
    camera.getWorldDirection(fwd); fwd.y = 0;
    if (fwd.lengthSq() > 1e-6) fwd.normalize();
    right.crossVectors(fwd, up).normalize();
    const speed = 0.02;
    camera.position.addScaledVector(fwd, -mv.y * speed);
    camera.position.addScaledVector(right, mv.x * speed);
    renderer.render(scene, camera);
  });

  addEventListener("resize", () => {
    camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  });
}

main().catch(fail);
</script>
</body>
</html>
